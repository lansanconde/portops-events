services:

  # ==========================================
  # KAFKA - Broker en mode KRaft
  # ==========================================
  kafka:
    image: apache/kafka:3.9.1
    container_name: portops-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # Mode KRaft : pas de ZooKeeper

      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Les topics doivent être créés explicitement
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
      interval: 10s
      timeout: 10s
      retries: 10

  # ==========================================
  # KAFKA UI - Interface web Kafka
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: portops-kafka-ui

    ports:
      - "8090:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: portops-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      kafka:
        condition: service_healthy

  # ==========================================
  # POSTGRESQL - Base de données
  # ==========================================
  postgres:
    image: postgres:16
    container_name: portops-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: portops
      POSTGRES_PASSWORD: portops
      POSTGRES_DB: missions

    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U portops"
      interval: 5s
      timeout: 5s
      retries: 10